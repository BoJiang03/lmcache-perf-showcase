# ============================================================== suites ======
#
# What suite.py runs: every (workload, deployment) pair of the suite, on
# tonight's images (runner/images.py). Bo 2026-10-06: LMCache nightly is the
# regression gate; competitors run weekly for comparison and never gate.
# Agentic only (Bo 2026-10-11: "我们只用agentic算了"): nqa stressed L1/L2 but ran
# ~1.4 requests at a time with <= 64 output tokens, so its TTFT/decode said little.

[suites.nightly]
workloads = ["agentic"]
deployments = ["vllm_lmcache"]
gate = true

# One pair through the whole chain (images, smoke, run, baseline, report);
# for checking the suite itself, ~1 h instead of nightly's two runs.
[suites.quick]
workloads = ["agentic"]
deployments = ["vllm_lmcache"]
gate = true

[suites.weekly]
workloads = ["agentic"]
deployments = ["vllm_native", "vllm_mooncake"]
gate = false

# Cross-night check (runner/baseline.py), Bo 2026-10-13: no per-metric
# thresholds ("我就是不想调参"). Each metric's nightly series is tested for a
# shift of its latest stretch to a worse level (rank-based, permutation
# p-value), so the noise of each metric sets its own sensitivity.
# The one setting is a policy: expected false alarms per gated run, all
# metrics together; 0.033 is about one a month at one run a night. From it,
# a regime needs >= 10 runs before it can fail, and in simulation a 2-sigma
# shift is confirmed after a median of 5-6 nights.
[regression]
metrics = ["decode_p10", "decode_p50", "ttft_p50", "ttft_p95"]
false_alarm_rate = 0.033

[lmcache]
# The LMCache under test: suite.py checks out the tip of this branch into
# <host.root>/<checkout> (a clone it owns) before building.
repo = "https://github.com/LMCache/LMCache.git"
branch = "dev"
checkout = "prt-lmcache-src"

# =========================================================== workloads ======
#
# A workload = pinned trace + AIPerf args on top of [aiperf] + scoring window.
# Every run reports the same metric set (runner/score.py); pass or fail is the
# regression check against past runs ([regression]), never a fixed floor.
# Percentiles are linear-interpolated.
# `vllm_args` here change the serving shape the workload needs (e.g. a GPU KV
# cap) and apply to every deployment.

[workloads.agentic]
description = "Claude Code session replay (weka cc-traces 256k), closed loop; main gate"
# Bo, 2026-10-08: N=230, just past the knee on purpose (more cache-layer load).
# h200-26, retention 512, vllm_lmcache: N=220 TTFT p95 5.26 s, KV max 0.90,
# 18.6% external; N=230 TTFT p95 9.80 s, KV max 0.995, 32.9% external.
# records/2026/10/08/1_stock_concurrency_*, 4_*.
concurrency = 230

# HF dataset at a pinned revision, split into one file per session tree by
# workloads/agentic/fetch_trace.py (`build` makes it, `check` verifies it).
# Byte-identical to prt-cache/work/weka-062126-256k-dir used by the baseline.
[workloads.agentic.trace]
hf_dataset = "semianalysisai/cc-traces-weka-062126-256k"
revision = "8fecd2fc56694469f758f0afbbb6335ad3043740"
sha256 = "e39cd2ff3eba21d4a3664be51da743ac3d2149a1933898cafc7bfeac8147eeef"  # traces.jsonl
fetch = "workloads/agentic/fetch_trace.py"
dir = "work/weka-062126-256k-dir"  # under host.root
# fetch_trace.py digest of `dir`; the runner refuses a run on a mismatch.
dir_digest = "0766fc32f6ba084bc36c897221726e88c1c2e55094fd9bad9ce7aab95464610f"

[workloads.agentic.aiperf]
env = { PRT_LIVE_HISTORY_TOKENIZER = "/raid/bo/p2pbench/models/Step-3.7-Flash-FP8", AIPERF_DATASET_WEKA_PARALLEL_WORKERS = "1" }
# PRT_LIVE_HISTORY_LOG_DIR = <artifact_dir>/prt_live_history, set by the runner
server_metrics = true  # --server-metrics = vLLM /metrics + the deployment's server_metrics

[workloads.agentic.aiperf.args]
scenario = "inferencex-agentx-mvp"
unsafe-override = true
# A repo id, not the model path: with HF_HUB_OFFLINE=1, AIPerf 0.13.0 passes
# the name to snapshot_download, which rejects paths. Same files via the alias.
tokenizer = "stepfun-ai/Step-3.7-Flash-FP8"  # resolved via the HF_HOME alias
custom-dataset-type = "weka_trace"
max-context-length = 262144
prompt-corpus = "coding"
cache-bust = "first_turn_prefix"
benchmark-duration = 960
benchmark-grace-period = 60
ui = "simple"

# Window starts at the first profiling request; a request counts if it ENDS
# inside (completed requests in the window are reported as throughput).
[workloads.agentic.scoring]
window = { anchor = "first_profiling_start", offset_s = 0, length_s = 960, count_by = "end" }

[workloads.nqa]
description = "NarrativeQA long-document QA, open loop; most hits must come from the cache layer"
# Working set 28M tokens at 0.6 req/s (Bo 2026-10-11: "working set撑到l2，要让
# l1，l2都有压力"): past the 800 GiB L1 and into the 1.5 TB L2, with recompute
# well under the ~20k tok/s no-cache rate. The old 21M trace stopped hitting
# L2 after ~300 s, because L1 grew to hold nearly all of it.
# external_token_share and l2_read_gb (Bo 2026-10-06): reported, never gates.

# In git. Generated by gen_nqa_l1l2.py 28e6 0.6 1000 from
# prt-cache/tmp_analysis/workload2/docqa_norm.pkl (NarrativeQA test split
# tokenized with Step-3.7), which is not in git.
[workloads.nqa.trace]
path = "workloads/nqa/nqa_ws28m_r0p6_l1l2_combined.jsonl"
sha256 = "c33efd6e80fc2eb39f902b4622c50a8afdcf16eb71e2d20eeacab2d2bc7f0406"
generator = "workloads/nqa/gen_nqa_l1l2.py"
generator_input_sha256 = "88a77273a695263d413a7414177caede6411342f3c58221573a84360560548b6"

[workloads.nqa.vllm_args]
kv-cache-memory-bytes = 29334000000  # caps L0 at ~4M tokens

[workloads.nqa.aiperf.args]
tokenizer = "stepfun-ai/Step-3.7-Flash-FP8"  # resolved via the HF_HOME alias
custom-dataset-type = "mooncake_trace"
fixed-schedule = true
isl-block-size = 512
prompt-corpus = "sonnet"
cache-bust = "none"

# Warmup sends each doc once (391 docs, 1401 s paced); the scored part starts
# 1431.5 s after the first request (scored_start_s printed by the generator)
# and runs to the last request (~1000 s); a request counts if it STARTS inside.
[workloads.nqa.scoring]
window = { anchor = "first_request_start", offset_s = 1431.5, count_by = "start" }
